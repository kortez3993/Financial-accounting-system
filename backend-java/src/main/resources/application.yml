spring:
  datasource:
    url: jdbc:postgresql://localhost:4217/finance
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

jwt:
  secret: mySecretKeyForFinanceAppThatShouldBeVeryLongAndSecureForJWTTokenGeneration
  expiration: 900000